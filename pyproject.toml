[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robodk-ct-config"
version = "0.1.0"
description = "Drive RoboDK arms through ct_config navigation nodes"
requires-python = ">=3.9"
dependencies = [
    "robodk>=5.6.0",
    "PyYAML>=6.0",
    "PySide6>=6.5",
]

[tool.setuptools]
packages = ["ct_nav", "ct_nav_robodk", "ct_nav_robodk.ui"]
